{% set name = "pygobject" %}
{% set version = "3.56.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 12760e4a0e3d04b6eb95e06f7a27e362c826d567ea613373a92c003b6c70d2d6

build:
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - meson >=0.64.0
    - ninja
    - pkg-config
  host:
    - glib {{ glib }}
    - gobject-introspection >=1.64.0
    - libffi {{ libffi }}
    - pycairo >=1.16.0
    - cairo
    - python
    - xorg-xorgproto   # [linux]
    - zlib {{ zlib }}
    - freetype {{ freetype }}
  run:
    - libgirepository
    - libiconv  # on Windows we seem to need the conda-forge version here (see #15)
    - pycairo >=1.16
    - python
    - ucrt  # [win]

test:
  requires:
    - pkg-config
  imports:
    - gi
    - gi.repository.GLib
    - gi._gi_cairo
  commands:
    # verify that header gets installed and can be located through pkg-config
    - test -f $PREFIX/include/pygobject-3.0/pygobject.h  # [unix]
    - test -f `pkg-config --variable=pygobjectincludedir --dont-define-prefix pygobject-3.0`/pygobject.h  # [unix]
    - if not exist %LIBRARY_INC%\\pygobject-3.0\\pygobject.h exit 1  # [win]
    - for /f "usebackq tokens=*" %%a in (`pkg-config --variable=pygobjectincludedir --dont-define-prefix pygobject-3.0`) do if not exist "%%a/pygobject.h" exit 1  # [win]

about:
  home: https://pygobject.gnome.org
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: COPYING
  summary: Python bindings for GObject Introspection
  description: |
    PyGObject is a Python package which provides bindings for GObject based libraries
    such as GTK+, GStreamer, WebKitGTK+, GLib, GIO and many more.
  doc_url: https://pygobject.gnome.org
  dev_url: https://gitlab.gnome.org/GNOME/pygobject

extra:
  recipe-maintainers:
    - pkgw
    - ryanvolz
    - sebastian-luna-valero
    - tschoonj
